# AgentRouter — provider dengan Anthropic Messages dan OpenAI Responses
# Docs: https://ps.air-outer.com/docs/
name: AgentRouter
url: https://ps.air-outer.com
free_quota: "credit awal $150-200"
status: terbatas  # tes 2026-10-29: 3 model hidup via Responses/Anthropic; Chat 400/503
standalone_docs: providers/agentrouter/README.md

formats:
  # Format Anthropic Messages — format yang terbukti hidup pada 2026-10-29
  anthropic_messages:
    base_url: https://ps.air-outer.com      # TANPA /v1
    endpoint: /v1/messages
    key_env: AGENTROUTER_API_KEY
    models: [gpt-6.1-sol, gpt-6-astra, gpt-5.6-sol]
    extra_headers:                          # fingerprint client WAJIB, kalau tidak 401
      user-agent: "claude-cli/2.1.195 (external, sdk-cli)"
      x-app: cli
      x-stainless-package-version: "0.0.0"
      x-stainless-runtime: python
      x-stainless-os: windows
    moderation:
      # Anchor utk lolos moderasi bahasa. Pilihan (prioritas turun):
      #   anchor_text: "teks bebas"  -> override penuh
      #   anchor_file: custom_chat   -> file anchors/custom_chat.yaml
      #   english_anchor: true       -> varian "general" (netral, default)
      #   english_anchor: coding     -> varian bawaan ATAU nama file anchors/*.yaml
      # Override sementara dari CLI: python run.py --anchor extraction ...
      # Daftar semua anchor: python run.py --list-anchors
      english_anchor: true                  # prompt non-Inggris kena content-blocked
    list_models:
      endpoint: /v1/models
      method: GET

  # AgentRouter mengarahkan model GPT ke Responses API, bukan Chat Completions.
  openai_responses:
    base_url: https://ps.air-outer.com/v1
    endpoint: /responses
    key_env: AGENTROUTER_API_KEY
    models: [gpt-6.1-sol, gpt-6-astra, gpt-5.6-sol]
    extra_headers:
      user-agent: "claude-cli/2.1.195 (external, sdk-cli)"
      x-app: cli
      x-stainless-package-version: "0.0.0"
      x-stainless-runtime: python
      x-stainless-os: windows
    moderation:
      english_anchor: true
    list_models:
      endpoint: /models
      method: GET

gotcha:
  - "401 'unauthorized client detected' = fingerprint header kurang, BUKAN key salah"
  - "403 = key valid tapi model tidak diizinkan untuk key tersebut"
  - "2026-10-29: /v1/models hanya mengembalikan gpt-5.6-sol, gpt-6-astra, gpt-6.1-sol; katalog bukan bukti request akan berhasil"
  - "2026-10-29: model GPT tersebut HTTP 400 di /v1/chat/completions; gunakan /v1/responses atau /v1/messages"
  - "503 '无可用渠道' (no available channel) = gateway tidak punya channel upstream; pada 2026-10-29 berlaku untuk claude-opus-5, claude-opus-4-8, glm-5.3, deepseek-v4-flash"
  - "prompt non-Inggris -> 400 content-blocked; solusinya ENGLISH_ANCHOR"
  - "key lama (AGENTROUTER_API_KEY) bisa semua model di kedua endpoint; key baru hanya gpt-5.6-sol"
  - "model claude-opus-4-6/4-7 sudah dihapus per 2026-08-20"
  - "glm-5.3 & deepseek-v4-flash (baru per 2026-08-27): tersedia di kedua endpoint, tool calling OK, tanpa vision; deepseek-v4-flash adalah model reasoning"
  - "gpt-6-astra (baru per 2026-09): tersedia di kedua endpoint, chat+vision OK, tool calling OK, BUKAN model reasoning"
  - "deepseek-v4-flash = model reasoning: max_tokens kecil (mis. 32) -> jawaban kosong; pakai >= 1024"
  - "err 503 bisa mengandung teks Cina; cetak error di Windows butuh stdout UTF-8 (run.py sudah reconfigure)"
